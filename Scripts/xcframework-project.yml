# XcodeGen spec for a throwaway framework project used only to build the
# binary PaidUpKit.xcframework. SPM packages archive as bare objects, so a
# framework target is generated around the same sources instead.
name: PaidUpKitFramework
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  PaidUpKit:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/PaidUpKit
        excludes:
          - "Documentation.docc"
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
        SKIP_INSTALL: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.nimishkhandelwal.PaidUpKit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
